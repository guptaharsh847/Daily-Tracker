<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Tracker</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="header">
      <h1>🔥 Daily Tracker</h1>
      <nav class="tracker-nav">
        <button id="navDaily" class="nav-btn active">Daily Tracker</button>
        <button id="navSadhana" class="nav-btn">Sadhana Form</button>
      </nav>
    </div>

    <div class="container">
      <div class="date-container">
        <label for="date">Select Date:</label>
        <input type="date" id="date" />
      </div>

      <!-- Daily Tracker View -->
      <div id="dailyTrackerView">
        <div id="tasks" class="tasks-container">
          <div class="loading">Loading tasks...</div>
        </div>
      </div>

      <!-- Sadhana Tracker View -->
      <div id="sadhanaTrackerView" style="display: none">
        <form id="sadhanaForm" class="tasks-container">
          <div class="form-group">
            <label for="wakeUp">Wake Up Time</label>
            <input type="time" id="wakeUp" name="wakeUp" />
          </div>
          <div class="form-group">
            <label for="sleep">Sleep Time</label>
            <input type="time" id="sleep" name="sleep" />
          </div>
          <div class="form-group">
            <label for="rounds">Rounds (Number)</label>
            <input
              type="number"
              id="rounds"
              name="rounds"
              placeholder="e.g., 16"
            />
          </div>
          <div class="form-group">
            <label for="chantTime">Chant Time (HH:MM:SS)</label>
            <input type="time" id="chantTime" name="chantTime" step="1" />
          </div>
          <div class="form-group">
            <label for="studyTime">Study Time (in mins)</label>
            <input
              type="number"
              id="studyTime"
              name="studyTime"
              placeholder="e.g., 60"
            />
          </div>
          <div class="form-group">
            <label for="readingTime">Reading Time (in mins)</label>
            <input
              type="number"
              id="readingTime"
              name="readingTime"
              placeholder="e.g., 30"
            />
          </div>
          <div class="form-group">
            <label for="bookName">Book Name</label>
            <input
              type="text"
              id="bookName"
              name="bookName"
              placeholder="e.g., Bhagavad Gita"
            />
          </div>
          <div class="form-group">
            <label for="lectureTime">Lecture Time (in mins)</label>
            <input
              type="number"
              id="lectureTime"
              name="lectureTime"
              placeholder="e.g., 45"
            />
          </div>
          <div class="form-group">
            <label for="lectureName">Lecture Name</label>
            <input
              type="text"
              id="lectureName"
              name="lectureName"
              placeholder="e.g., The nature of the soul"
            />
          </div>
          <div class="form-group">
            <label for="remark">Remark</label>
            <textarea
              id="remark"
              name="remark"
              rows="3"
              placeholder="Any other notes..."
            ></textarea>
          </div>
        </form>
      </div>

      <div class="actions">
        <button class="btn btn-submit" id="submitBtn">Submit ✅</button>
        <button class="btn btn-share" id="shareBtn">
          Share on WhatsApp 💬
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
