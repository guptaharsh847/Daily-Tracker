<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Tracker</title>

    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="header">
      <h1>🔥 Daily Tracker</h1>
      <nav class="tracker-nav">
        <button id="navDaily" class="nav-btn active">Daily Tracker</button>
        <button id="navSadhana" class="nav-btn">Sadhana Form</button>
      </nav>
    </div>

    <div class="container">
      <div class="date-container">
        <label for="date">Select Date:</label>
        <input type="date" id="date" />
      </div>

      <!-- Daily Tracker View -->
      <div id="dailyTrackerView">
        <div id="tasks" class="tasks-container">
          <div class="loading">Loading tasks...</div>
        </div>
      </div>

      <!-- Sadhana Tracker View -->
      <div id="sadhanaTrackerView" style="display: none">
        <form id="sadhanaForm" class="tasks-container sadhana-grid">
          <div class="form-group">
            <label for="wakeUp">Wake Up Time</label>
            <input type="time" id="wakeUp" name="wakeUp" required />
          </div>
          <div class="form-group">
            <label for="sleep">Sleep Time</label>
            <input type="time" id="sleep" name="sleep" required />
          </div>
          <div class="form-group">
            <label for="rounds">Rounds (Number)</label>
            <input
              type="number"
              id="rounds"
              name="rounds"
              placeholder="e.g., 16"
              required
            />
          </div>
          <div class="form-group">
            <label for="chantTime">Chant Time (HH:MM:SS)</label>
            <input
              type="time"
              id="chantTime"
              name="chantTime"
              step="1"
              required
            />
          </div>
          <div class="form-group">
            <label for="studyTime">Study Time (in mins)</label>
            <input
              type="number"
              id="studyTime"
              name="studyTime"
              placeholder="e.g., 60"
              required
            />
          </div>
          <div class="form-group">
            <label for="readingTime">Reading Time (in mins)</label>
            <input
              type="number"
              id="readingTime"
              name="readingTime"
              placeholder="e.g., 30"
              required
            />
          </div>
          <div class="form-group">
            <label for="bookName">Book Name</label>
            <input
              type="text"
              id="bookName"
              name="bookName"
              placeholder="e.g., Bhagavad Gita"
              required
            />
          </div>
          <div class="form-group">
            <label for="lectureTime">Lecture Time (in mins)</label>
            <input
              type="number"
              id="lectureTime"
              name="lectureTime"
              placeholder="e.g., 45"
              required
            />
          </div>
          <div class="form-group">
            <label for="lectureName">Lecture Name</label>
            <input
              type="text"
              id="lectureName"
              name="lectureName"
              placeholder="e.g., The nature of the soul"
              required
            />
          </div>
          <div class="form-group">
            <label for="remark">Remark</label>
            <textarea
              id="remark"
              name="remark"
              rows="3"
              placeholder="Any other notes..."
            ></textarea>
          </div>
        </form>

        <!-- <div class="download-section">
          <h3>Download Sadhana Report</h3>
          <div class="download-flex">
            <div class="form-group">
              <label for="startDate">Start Date</label>
              <input type="date" id="startDate" />
            </div>
            <div class="form-group">
              <label for="endDate">End Date</label>
              <input type="date" id="endDate" />
            </div>
          </div>
          <button class="btn btn-download" id="downloadBtn" type="button">
            Download Excel/CSV 📥
          </button>
        </div> -->
      </div>

      <div class="actions">
        <button class="btn btn-submit" id="submitBtn">Submit ✅</button>
        <button class="btn btn-view" id="viewBtn">View Data 👁️</button>
        <button class="btn btn-share" id="shareBtn">Share 💬</button>
      </div>
    </div>

    <div id="toastContainer"></div>

    <!-- Custom Install Prompt -->
    <div id="installPrompt" class="install-prompt" style="display: none">
      <div class="install-prompt-content">
        <p>Install Daily Tracker for a better experience?</p>
        <div class="install-prompt-actions">
          <button id="installBtn" class="btn btn-submit" style="padding: 8px">
            Install
          </button>
          <button
            id="cancelInstallBtn"
            class="btn"
            style="
              padding: 8px;
              background: transparent;
              border: 1px solid var(--primary);
              color: var(--text-main);
            "
          >
            Not Now
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
